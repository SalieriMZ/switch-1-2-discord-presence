name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create venv
        # build.ps1 uses .venv\Scripts\python.exe
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 -Zip
      - name: Version
        id: version
        run: echo "version=$(.venv\Scripts\python -c 'import nso_rpc; print(nso_rpc.__version__)')" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: NSO-Discord-RPC-${{ steps.version.outputs.version }}
          path: dist/NSO-Discord-RPC-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag matches version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ needs.build.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${{ needs.build.outputs.version }}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: NSO-Discord-RPC-${{ needs.build.outputs.version }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" NSO-Discord-RPC-*.zip
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
